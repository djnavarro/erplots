# R-hub's generic GitHub Actions workflow file. It's canonical location is at
# https://github.com/r-hub/actions/blob/v1/workflows/rhub.yaml
# You can update this file to a newer version using the rhub2 package:
#
# rhub::rhub_setup()
#
# It is unlikely that you need to modify this file manually.
#
# Default `config` chosen for erplots specifically (pure R, no compiled
# code -- see DESCRIPTION, no `src/`). The regular R-CMD-check.yaml
# matrix already covers ubuntu-latest (devel/release/oldrel-1),
# windows-latest (release), and macos-latest/arm64 (release), so the
# plain `linux`/`windows`/`macos` R-hub VMs would mostly duplicate that.
# Instead the default below covers:
#   - nosuggests:   exercises the requireNamespace()/
#                   skip_if_not_installed() guards around the
#                   Suggests-only erglm/emaxnls integration with none
#                   of Suggests installed.
#   - donttest:     runs \donttest{} examples that a normal
#                   `R CMD check` skips.
#   - ubuntu-next:  R-patched/R-next, ahead of the next R release --
#                   complements the ubuntu-latest devel/release/
#                   oldrel-1 already covered by R-CMD-check.yaml.
#   - ubuntu-clang: a different OS/compiler baseline (Ubuntu 22.04 +
#                   clang) than the gcc-based Ubuntu 24.04 already
#                   covered; can surface graphics-device/font-rendering
#                   differences even without compiled code.
#   - windows, macos-arm64: get R-devel coverage on non-Linux
#                   platforms, which R-CMD-check.yaml only runs at
#                   release for those OSes.
# `noremap` was tried and dropped: it disables C symbol remapping, and
# vctrs (pulled in transitively via dplyr) fails to load there with
# "error: symbol bindings not supported yet" before erplots' own code
# is ever reached -- an environment-level incompatibility unrelated to
# erplots, not a check finding worth keeping around.
# See https://r-hub.github.io/containers/containers.html for the full
# platform list if this needs revisiting later.

name: R-hub
run-name: >-
  ${{ github.event.inputs.id || format('Manual run by @{0}', github.triggering_actor) }}:
  ${{ github.event.inputs.name || github.event.inputs.config }}

on:
  workflow_dispatch:
    inputs:
      config:
        description: >-
          Comma-separated list of R-hub platforms to use.
          Full list: https://r-hub.github.io/containers/
        type: string
        default: 'nosuggests,donttest,ubuntu-clang,ubuntu-next,windows,macos-arm64'
      name:
        description: 'Run name. You can leave this empty.'
        type: string
      id:
        description: 'Unique ID. You can leave this empty.'
        type: string

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.rhub-setup.outputs.containers }}
      platforms: ${{ steps.rhub-setup.outputs.platforms }}

    steps:
    # NO NEED TO CHECKOUT HERE
    - uses: r-hub/actions/setup@v1
      with:
        config: ${{ github.event.inputs.config }}
      id: rhub-setup

  linux-containers:
    needs: setup
    if: ${{ needs.setup.outputs.containers != '[]' }}
    runs-on: ubuntu-latest
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
    container:
      image: ${{ matrix.config.container }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/run-check@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}

  other-platforms:
    needs: setup
    if: ${{ needs.setup.outputs.platforms != '[]' }}
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.platforms) }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/setup-r@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/run-check@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
