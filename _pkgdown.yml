url: https://erplots.djnavarro.net/
template:
  package: waeponwifestre

reference:
- title: Exposure-response plots
  desc: The compositional mini-grammar for designing exposure-response plots, dividing plot structure into distinct layers for the data, the model, the quantile summaries, textual summaries, and the exposure group plots.
- contents:
  - er_plot
  - er_plot_add_model
  - er_plot_add_summary
  - er_plot_add_quantiles
  - er_plot_add_data
  - er_plot_add_groups
  - er_plot_theme
  - er_plot_build
- title: Time-to-event plots
  desc: The compositional mini-grammar for designing Kaplan-Meier/survival-over-time plots, dividing plot structure distinct layers for survival curves, censoring markers, risk tables, textual summaries, and the survival model. 
- contents:
  - er_tte
  - er_tte_add_curve
  - er_tte_add_censor
  - er_tte_add_risktable
  - er_tte_add_summary
  - er_tte_add_model
  - er_tte_theme
  - er_tte_build
- title: Visual predictive check plots
  desc: The compositional mini-grammar for desigining visual predictive check plots, dividing plot structure into distinct layers for the observed data and the simulated data.
- contents:
  - er_vpc
  - er_vpc_add_observed
  - er_vpc_add_simulated
  - er_vpc_theme
  - er_vpc_build
- title: Builder functions for exposure-response plots
  desc: Low level functions to draw specific components of an exposure-response plot. Each function supports one option for the `style` argument to the corresponding layer in the exposure-response plot.
- contents: 
  - er_style
  - er_style_tag
  - er_style_model
  - er_style_summary
  - er_style_quantile
  - er_style_data
  - er_style_group
- title: Builder functions for time-to-event plots
  desc: Low level functions to draw specific components of a time-to-event plot. Each function supports one option for the `style` argument to the corresponding layer in the time-to-event plot.
- contents:
  - er_style_tte_curve
  - er_style_tte_censor
  - er_style_tte_risktable
  - er_style_tte_summary
  - er_style_tte_model
- title: Builder functions for visual predictive check plots
  desc: Low level functions to draw specific components of a VPC plot. Each function supports one option for the `style` argument to the corresponding layer in the VPC plot.
- contents:
  - er_style_vpc_observed
  - er_style_vpc_simulated
- title: Confidence intervals
  desc: Helper functions to compute confidence intervals
- contents:
  - ci_clopper_pearson
  - ci_poisson
  - ci_t
  - ci_quantile
- title: Model interface
  desc: Generic functions that define the interface between models and plots
- contents:
  - er_model_interface
- title: Other
  desc: Other functions and objects
- contents:
  - cut_quantile
  - erplots_data

